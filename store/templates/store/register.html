{% load static %}

<!DOCTYPE html>
<html>

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Create Account - ShopEase</title>

    <link rel="stylesheet"
          href="{% static 'store/style.css' %}">

    <style>

        .auth-container {
            min-height: 75vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .auth-box {
            background: white;
            width: 400px;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 5px 25px rgba(0,0,0,0.1);
        }

        .auth-box h1 {
            text-align: center;
            margin-bottom: 10px;
        }

        .auth-subtitle {
            text-align: center;
            color: #6b7280;
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
        }

        .form-group input {
            width: 100%;
            padding: 12px;
            border: 1px solid #d1d5db;
            border-radius: 7px;
            font-size: 15px;
        }

        .register-button {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 7px;
            background: #2563eb;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .register-button:hover {
            background: #1d4ed8;
        }

        .error {
            background: #fee2e2;
            color: #b91c1c;
            padding: 10px;
            border-radius: 6px;
            margin-bottom: 15px;
            text-align: center;
        }

        .auth-link {
            text-align: center;
            margin-top: 20px;
        }

        .auth-link a {
            color: #2563eb;
            text-decoration: none;
            font-weight: bold;
        }

    </style>

</head>

<body>

    <nav class="navbar">

        <div class="logo">
            🛍️ ShopEase
        </div>

        <div class="nav-right">

            <a href="/">
                Home
            </a>

            <a href="{% url 'login' %}">
                Login
            </a>

        </div>

    </nav>


    <div class="auth-container">

        <div class="auth-box">

            <h1>
                Create Account ✨
            </h1>

            <p class="auth-subtitle">
                Join ShopEase today
            </p>


            {% if error %}

                <div class="error">
                    {{ error }}
                </div>

            {% endif %}


            <form method="POST">

                {% csrf_token %}


                <div class="form-group">

                    <label>
                        Username
                    </label>

                    <input
                        type="text"
                        name="username"
                        placeholder="Choose a username"
                        required>

                </div>


                <div class="form-group">

                    <label>
                        Password
                    </label>

                    <input
                        type="password"
                        name="password"
                        placeholder="Create a password"
                        required>

                </div>


                <button class="register-button"
                        type="submit">

                    Create Account

                </button>

            </form>


            <div class="auth-link">

                Already have an account?

                <a href="{% url 'login' %}">
                    Login
                </a>

            </div>

        </div>

    </div>


    <footer class="footer">

        <p>
            © 2026 ShopEase. All Rights Reserved.
        </p>

    </footer>

</body>

</html>
